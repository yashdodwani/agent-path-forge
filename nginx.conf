server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: increase client body size for large requests
  client_max_body_size 10M;

  # Serve static assets with long cache times
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2|ttf|eot)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # If you want to forward API requests from the same origin to the backend,
  # you can enable a proxy_pass here. For Render, it's usually better to
  # set the backend URL in the frontend via VITE_API_BASE_URL and let the
  # browser call the backend directly.
}

